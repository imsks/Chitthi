services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chitthi_app
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
      - air_tmp:/app/tmp
    command: ["air"]
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: chitthi_web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://app:8080
      WATCHPACK_POLLING: "true"
    depends_on:
      - app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: chitthi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: chitthi_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/pg-docker-entrypoint.sh:/pg-docker-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/pg-docker-entrypoint.sh"]
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  air_tmp:
  web_node_modules:
